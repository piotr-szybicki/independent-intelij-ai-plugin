name: Release plugin

on:
  push:
    tags:
      - 'release/**'

# Needed to create a GitHub Release and upload the plugin ZIP to it.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish plugin
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release version and calculate next patch version
        id: version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#release/}"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use release/<major>.<minor>.<patch>, such as release/1.0.0." >&2
            exit 1
          fi

          PROJECT_VERSION="$(sed -n 's/^version = //p' gradle.properties)"
          if [[ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Tag version ($RELEASE_VERSION) must match gradle.properties ($PROJECT_VERSION)." >&2
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          echo "next_version=$MAJOR.$MINOR.$((PATCH + 1))" >> "$GITHUB_OUTPUT"

      - name: Test and verify plugin
        run: ./gradlew check verifyPlugin

      - name: Build plugin distribution
        run: ./gradlew buildPlugin

      - name: Create GitHub Release and upload plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" ./build/distributions/*.zip
          --verify-tag
          --generate-notes
          --title "${{ github.ref_name }}"

      - name: Open pull request for next patch version
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        shell: bash
        run: |
          BRANCH="feature/prepare-next-version-$NEXT_VERSION"
          sed -i "s/^version = .*/version = $NEXT_VERSION/" gradle.properties

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git switch -c "$BRANCH"
          git add -- gradle.properties
          git commit -m "Prepare $NEXT_VERSION"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Prepare $NEXT_VERSION" \
            --body "Bumps the Gradle patch version after releasing ${{ github.ref_name }}."
