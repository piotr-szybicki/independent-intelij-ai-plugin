group = com.github.piotrszybicki.independentintelijaiplugin
version = 1.0.0

pluginRepositoryUrl = https://github.com/piotr-szybicki/independent-intelij-ai-plugin

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# The IntelliJ Platform classpath is large enough that the default Kotlin compiler
# daemon heap can be exhausted during analysis. Keep Gradle's coordination heap
# modest while giving the compiler daemon room to compile incrementally.
org.gradle.jvmargs = -Xmx1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs = -Xmx2g

# PMD CPD duplicate-code detection. Override any value with -P<name>=<value>.
cpdMinimumTokens = 100
cpdIncludeTests = false
cpdIgnoreIdentifiers = false
cpdIgnoreLiterals = false
cpdFailOnViolation = true
